# ============================================================
# docker-compose.yml — Despliegue multi-VM con profiles
#
# Cada VM ejecuta UN perfil según su NODE_ID:
#   VM1 →  docker compose --profile nodo1 up --build
#   VM2 →  docker compose --profile nodo2 up --build
#   VM3 →  docker compose --profile nodo3 up --build   ← coordinador + RabbitMQ
#
# Forma recomendada (lee NODE_ID del .env automáticamente):
#   bash scripts/levantar_vm.sh          # primer plano
#   bash scripts/levantar_vm.sh -d       # background (daemon)
#
# Cada VM necesita su propio .env con sus IPs Tailscale.
# Copiar: cp .env.vm.example .env
# ============================================================

name: sd-taller2

# ════════════════════════════════════════════════════════════
#  SERVICIOS
# ════════════════════════════════════════════════════════════
services:

  # ── MongoDB ─────────────────────────────────────────────
  # Corre en TODAS las VMs (todos los perfiles).
  # Usa network_mode: host para que el mongod sea accesible
  # directamente por la IP Tailscale de la VM desde las otras.
  mongod:
    profiles: ["nodo1", "nodo2", "nodo3"]
    image: mongo:9.0
    container_name: sd-mongod
    network_mode: host
    command:
      - mongod
      - --replSet
      - rs-grupo
      - --bind_ip_all
      - --port
      - "27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - mongosh
        - --port
        - "27017"
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ── Inicializador del Replica Set ───────────────────────
  # Solo en VM3 (coordinador). Monta scripts/mongo-rs-init.sh
  # y espera que los 3 mongod estén respondiendo via Tailscale.
  mongo-init:
    profiles: ["nodo3"]
    image: mongo:9.0
    container_name: sd-mongo-init
    network_mode: host
    depends_on:
      mongod:
        condition: service_healthy
    restart: "no"
    environment:
      RS_MEMBER_1: "${RS_MEMBER_1}"   # 100.x.x.1:27017
      RS_MEMBER_2: "${RS_MEMBER_2}"   # 100.x.x.2:27017
      RS_MEMBER_3: "${RS_MEMBER_3}"   # 100.x.x.3:27017
    volumes:
      - ./scripts/mongo-rs-init.sh:/usr/local/bin/mongo-rs-init.sh:ro
    entrypoint: ["bash", "/usr/local/bin/mongo-rs-init.sh"]

  # ── RabbitMQ ────────────────────────────────────────────
  # Solo en VM3 (coordinador). Los nodos 1 y 2 se conectan
  # a esta instancia usando la IP Tailscale del coordinador.
  rabbitmq:
    profiles: ["nodo3"]
    image: rabbitmq:3.13-management
    container_name: sd-rabbitmq
    hostname: rabbitmq
    network_mode: host
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-sd_user}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-cambiar_esta_clave}"
      RABBITMQ_DEFAULT_VHOST: "/"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── Nodo Go 1 — VM1 ─────────────────────────────────────
  # Solo depende del mongod local. RabbitMQ es remoto (VM3)
  # y el nodo Go reintenta la conexión automáticamente.
  nodo1:
    profiles: ["nodo1"]
    build:
      context: ./src/bully-algorithm
      dockerfile: Dockerfile
    image: bully-nodo:latest
    container_name: sd-nodo
    network_mode: host
    depends_on:
      mongod:
        condition: service_healthy
    restart: on-failure
    environment:
      NODE_ID: "1"
      NODE_HOST: "${NODE_HOST}"
      NODE_PORT: "${NODE_PORT:-5000}"
      LISTEN_ADDRESS: "0.0.0.0:${NODE_PORT:-5000}"
      PEERS: "${PEERS}"
      DB_URI: "${DB_URI}"
      DB_NAME: "${DB_NAME:-inventory}"
      DB_NODE_COLLECTION: "${DB_NODE_COLLECTION:-nodes}"
      RABBITMQ_URL: "${RABBITMQ_URL}"
      RABBITMQ_METRICS_QUEUE: "${RABBITMQ_METRICS_QUEUE:-metrics}"
      RABBITMQ_ALLOCATIONS_QUEUE: "${RABBITMQ_ALLOCATIONS_QUEUE:-allocations}"
      RABBITMQ_FAILOVER_QUEUE: "${RABBITMQ_FAILOVER_QUEUE:-failover}"
      TIMEOUT_MS: "${TIMEOUT_MS:-3000}"
      HEARTBEAT_MS: "${HEARTBEAT_MS:-1000}"
      CAUSAL_WINDOW_MS: "${CAUSAL_WINDOW_MS:-3000}"
      METRICS_INTERVAL_MS: "${METRICS_INTERVAL_MS:-3000}"
      CONSUMER_PREFETCH: "${CONSUMER_PREFETCH:-100}"
      MANUAL_METRICS: "${MANUAL_METRICS:-false}"

  # ── Nodo Go 2 — VM2 ─────────────────────────────────────
  nodo2:
    profiles: ["nodo2"]
    build:
      context: ./src/bully-algorithm
      dockerfile: Dockerfile
    image: bully-nodo:latest
    container_name: sd-nodo
    network_mode: host
    depends_on:
      mongod:
        condition: service_healthy
    restart: on-failure
    environment:
      NODE_ID: "2"
      NODE_HOST: "${NODE_HOST}"
      NODE_PORT: "${NODE_PORT:-5000}"
      LISTEN_ADDRESS: "0.0.0.0:${NODE_PORT:-5000}"
      PEERS: "${PEERS}"
      DB_URI: "${DB_URI}"
      DB_NAME: "${DB_NAME:-inventory}"
      DB_NODE_COLLECTION: "${DB_NODE_COLLECTION:-nodes}"
      RABBITMQ_URL: "${RABBITMQ_URL}"
      RABBITMQ_METRICS_QUEUE: "${RABBITMQ_METRICS_QUEUE:-metrics}"
      RABBITMQ_ALLOCATIONS_QUEUE: "${RABBITMQ_ALLOCATIONS_QUEUE:-allocations}"
      RABBITMQ_FAILOVER_QUEUE: "${RABBITMQ_FAILOVER_QUEUE:-failover}"
      TIMEOUT_MS: "${TIMEOUT_MS:-3000}"
      HEARTBEAT_MS: "${HEARTBEAT_MS:-1000}"
      CAUSAL_WINDOW_MS: "${CAUSAL_WINDOW_MS:-3000}"
      METRICS_INTERVAL_MS: "${METRICS_INTERVAL_MS:-3000}"
      CONSUMER_PREFETCH: "${CONSUMER_PREFETCH:-100}"
      MANUAL_METRICS: "${MANUAL_METRICS:-false}"

  # ── Nodo Go 3 — VM3 (coordinador) ───────────────────────
  # Espera a que RabbitMQ y el RS estén listos antes de arrancar.
  nodo3:
    profiles: ["nodo3"]
    build:
      context: ./src/bully-algorithm
      dockerfile: Dockerfile
    image: bully-nodo:latest
    container_name: sd-nodo
    network_mode: host
    depends_on:
      mongod:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    restart: on-failure
    environment:
      NODE_ID: "3"
      NODE_HOST: "${NODE_HOST}"
      NODE_PORT: "${NODE_PORT:-5000}"
      LISTEN_ADDRESS: "0.0.0.0:${NODE_PORT:-5000}"
      PEERS: "${PEERS}"
      DB_URI: "${DB_URI}"
      DB_NAME: "${DB_NAME:-inventory}"
      DB_NODE_COLLECTION: "${DB_NODE_COLLECTION:-nodes}"
      # En VM3 RabbitMQ corre local → localhost
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-sd_user}:${RABBITMQ_PASS:-cambiar_esta_clave}@localhost:5672/"
      RABBITMQ_METRICS_QUEUE: "${RABBITMQ_METRICS_QUEUE:-metrics}"
      RABBITMQ_ALLOCATIONS_QUEUE: "${RABBITMQ_ALLOCATIONS_QUEUE:-allocations}"
      RABBITMQ_FAILOVER_QUEUE: "${RABBITMQ_FAILOVER_QUEUE:-failover}"
      TIMEOUT_MS: "${TIMEOUT_MS:-3000}"
      HEARTBEAT_MS: "${HEARTBEAT_MS:-1000}"
      CAUSAL_WINDOW_MS: "${CAUSAL_WINDOW_MS:-3000}"
      METRICS_INTERVAL_MS: "${METRICS_INTERVAL_MS:-3000}"
      CONSUMER_PREFETCH: "${CONSUMER_PREFETCH:-100}"
      MANUAL_METRICS: "${MANUAL_METRICS:-false}"

# ════════════════════════════════════════════════════════════
#  VOLÚMENES
# (sin sección networks: todo usa network_mode: host)
# ════════════════════════════════════════════════════════════
volumes:
  mongo-data:
  rabbitmq-data:
