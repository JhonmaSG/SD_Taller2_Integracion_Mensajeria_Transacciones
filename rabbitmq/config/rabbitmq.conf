# Puerto AMQP para productores y consumidores.
listeners.tcp.default = 5672

# Puerto del panel RabbitMQ Management.
management.tcp.port = 15672

# Carga las colas declaradas en definitions.json al iniciar RabbitMQ.
management.load_definitions = /etc/rabbitmq/definitions.json

# Límite de memoria relativo para evitar que RabbitMQ consuma toda la VM.
vm_memory_high_watermark.relative = 0.60

# Intervalo de comprobación de espacio en disco.
disk_free_limit.absolute = 100MB

# Logs enviados a stdout/stderr para poder consultarlos con Docker.
log.console = true
log.console.level = info
